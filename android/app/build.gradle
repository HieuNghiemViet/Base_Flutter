plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.nvhh.base_flutter"
    compileSdkVersion 35
    ndkVersion "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    kotlin {
        jvmToolchain(17)
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.hhnv.base_flutter"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            keyAlias keystoreProperties['keyAliasDebug']
            keyPassword keystoreProperties['keyPasswordDebug']
            storeFile keystoreProperties['storeFileDebug'] ? file(keystoreProperties['storeFileDebug']) : null
            storePassword keystoreProperties['storePasswordDebug']
        }

        release {
            keyAlias keystoreProperties['keyAliasRelease']
            keyPassword keystoreProperties['keyPasswordRelease']
            storeFile keystoreProperties['storeFileRelease'] ? file(keystoreProperties['storeFileRelease']) : null
            storePassword keystoreProperties['storePasswordRelease']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    flavorDimensions "app"

    productFlavors {
        dev {
            dimension "app"
            resValue "string", "app_name", ":DEV Base Flutter"
            applicationId "com.nvhh.base_flutter.dev"
            flutter.target "lib/main_dev.dart"
            versionCode 1
            versionName "1.0.0"
        }

        stg {
            dimension "app"
            resValue "string", "app_name", ":STG Base Flutter"
            applicationId "com.nvhh.base_flutter.stg"
            flutter.target "lib/main_stag.dart"
            versionCode 1
            versionName "1.0.0"
        }

        prod {
            dimension "app"
            resValue "string", "app_name", "Base Flutter"
            applicationId "com.nvhh.base_flutter"
            flutter.target "lib/main_prod.dart"
            versionCode 1
            versionName "1.0.0"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation group: 'androidx.biometric', name: 'biometric', version: '1.1.0'
    implementation 'com.google.mlkit:face-detection:16.1.5'
    implementation group: 'io.branch.sdk.android', name: 'library', version: '5.12.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:17.1.0+'
    implementation 'androidx.browser:browser:1.0.0'
    implementation(platform("com.google.firebase:firebase-bom:32.2.0"))
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}